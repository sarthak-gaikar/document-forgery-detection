# configs/realtext_unet_finetune.yaml
# Fine-tuning configuration for U-Net ResNet-34 on RealText-V2
# Uses FocalDiceLoss to heavily penalize missed character strokes
defaults:
  - base

paths:
  data_root: data/realtext_v2/
  checkpoint_dir: outputs/checkpoints/realtext_finetune/
  log_dir: outputs/logs/realtext_finetune/

model:
  name: unet_resnet34
  type: segmentation
  arch: unet
  encoder: resnet34
  encoder_weights: null
  in_channels: 3
  classes: 1

training:
  batch_size: 8
  lr: 5.0e-5
  epochs: 15
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 1
  early_stopping_patience: 6
  amp: true

loss:
  seg_loss: focal_dice
  focal_gamma: 2.0
  dice_smooth: 1.0

